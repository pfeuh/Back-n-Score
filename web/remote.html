<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Audio Remote Control</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #FFFFFF;
            font-family: sans-serif;
            overflow: hidden;
            height: 100vh;
            height: -webkit-fill-available;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* --- Barre de transport ultra-robuste (Table Layout compatible Android 4) --- */
        #transport-bar {
            background-color: #1e1e1e;
            border-bottom: 2px solid #333;
            padding: 10px;
            flex-shrink: 0;
            z-index: 10;
        }

        .transport-row {
            display: table;
            width: 100%;
            table-layout: fixed;
            border-collapse: separate;
            border-spacing: 8px 0; /* Espacement horizontal entre les boutons */
            margin-bottom: 8px;
        }

        .transport-row:last-child {
            margin-bottom: 0;
        }

        .transport-btn {
            background-color: #2a2a2a;
            color: #FFF;
            border: 1px solid #444;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            text-align: center;
            white-space: nowrap;
            display: table-cell;
            vertical-align: middle;
            height: 54px; /* Hauteur générique unifiée et confortable */
        }

        .transport-btn:active {
            background-color: #555;
        }

        .transport-btn.stop {
            background-color: #c0392b;
            border-color: #e74c3c;
            width: 37.5%; /* 3 parts sur 8 */
        }

        .transport-btn.stop:active {
            background-color: #e74c3c;
        }

        .transport-btn.play {
            background-color: #2c3e50;
            border-color: #34495e;
            width: 37.5%; /* 3 parts sur 8 */
        }

        .transport-btn.play:active {
            background-color: #1a252f;
        }

        .transport-btn.menu {
            background-color: #4f4f4f;
            border-color: #666;
            width: 25%; /* 2 parts sur 8 */
        }

        /* --- Icônes en pur CSS (Compatibles Android 4) --- */

        /* Icône STOP : Carré plein */
        .stop-icon {
            display: inline-block;
            width: 18px;
            height: 18px;
            background: #FFF;
            vertical-align: middle;
        }

        /* Icône PLAY/PAUSE : 2 barres + triangle parfaitement espacés */
        .play-pause-icon {
            display: inline-block;
            vertical-align: middle;
            height: 18px;
            white-space: nowrap;
        }

        .bar-vertical {
            display: inline-block;
            width: 3px;
            height: 18px;
            background: #FFF;
            position: relative;
            vertical-align: middle;
            box-shadow: 6px 0 0 #FFF; /* 2ème barre collée à 6px */
        }

        .triangle-right {
            display: inline-block;
            width: 0;
            height: 0;
            border-top: 9px solid transparent;
            border-bottom: 9px solid transparent;
            border-left: 14px solid #FFF;
            vertical-align: middle;
            margin-left: 5px; /* Espace propre après la shadow de la 2ème barre */
        }

        /* Icône MENU : 3 barres horizontales */
        .hamburger-icon {
            display: inline-block;
            width: 22px;
            height: 4px;
            background: #FFF;
            position: relative;
            vertical-align: middle;
            box-shadow: 0 -7px 0 #FFF, 0 7px 0 #FFF;
            margin: 7px 0;
        }

        .locator-group {
            display: table-cell;
            width: 25%;
            vertical-align: top;
        }

        .locator-jump {
            background-color: #2980b9;
            border-color: #3498db;
            height: 54px;
            font-size: 18px;
            width: 100%;
            display: block;
            border-radius: 8px;
            border: 1px solid #3498db;
            color: #FFF;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
        }

        .locator-set {
            background-color: #7f8c8d;
            border-color: #95a5a6;
            height: 54px;
            font-size: 16px;
            width: 100%;
            display: block;
            margin-bottom: 4px;
            border-radius: 8px;
            border: 1px solid #95a5a6;
            color: #FFF;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
        }

        /* --- Structure Popup / Arbre attendue par tree.js --- */
        #tree-popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 99;
        }

        #tree-popup-content {
            position: fixed;
            top: 60px; left: 10px; right: 10px; bottom: 10px;
            background: #121212;
            border: 1px solid #444;
            border-radius: 8px;
            z-index: 100;
            display: none;
        }

        body.tree-open #tree-popup-content {
            display: block;
        }

        /* Conteneur principal affiché par défaut sous la barre de transport */
        #tree-container {
            position: relative;
            flex-grow: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background-color: #121212;
        }

        /* Forçage global sur TOUS les éléments de l'arbre (titres, livres, étagères) */
        #tree-container *, 
        #tree-popup-content * {
            font-size: 36px !important;
        }

        .item-row {
            display: block;
            width: 100%;
            padding: 16px 18px !important;
            border-bottom: 1px solid #333;
            box-sizing: border-box;
            cursor: pointer;
            color: #FFFFFF !important;
            line-height: 1.3 !important;
            white-space: nowrap;
        }

        .btn-cancel {
            background: #333;
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Barre de transport -->
    <div id="transport-bar">
        <div class="transport-row main-controls">
            <button class="transport-btn stop" onclick="sendTransport('stop')"><span class="stop-icon"></span></button>
            <button class="transport-btn play" onclick="sendTransport('play')">
                <span class="play-pause-icon">
                    <span class="bar-vertical"></span>
                    <span class="triangle-right"></span>
                </span>
            </button>
            <button class="transport-btn menu" onclick="sendMenu()"><span class="hamburger-icon"></span></button>
        </div>
        <div class="transport-row">
            <div class="locator-group">
                <button class="locator-set" onclick="sendSetLocator(1)">set A</button>
                <button class="locator-jump" onclick="sendLocator(1)">A</button>
            </div>
            <div class="locator-group">
                <button class="locator-set" onclick="sendSetLocator(2)">set B</button>
                <button class="locator-jump" onclick="sendLocator(2)">B</button>
            </div>
            <div class="locator-group">
                <button class="locator-set" onclick="sendSetLocator(3)">set C</button>
                <button class="locator-jump" onclick="sendLocator(3)">C</button>
            </div>
            <div class="locator-group">
                <button class="locator-set" onclick="sendSetLocator(4)">set C</button>
                <button class="locator-jump" onclick="sendLocator(4)">D</button>
            </div>
        </div>
    </div>

    <!-- Éléments requis pour tree.js -->
    <div id="tree-popup-overlay"></div>
    <div id="tree-popup-content"></div>

    <!-- Conteneur de l'arbre principal -->
    <div id="tree-container"></div>

    <!-- Scripts de ton projet -->
    <script src="/static/js/objects.js"></script>
    <script src="/static/js/network.js"></script>
    <script src="/static/js/tree.js"></script>
    <script>
        var DATA_TRACKS = null;
        var DATA_UI_POPULAR = null;
        var DATA_UI_CLASSIQUE = null;
        var META_INSTRUMENTS = null;

        var track_location = createProp({ 
            key: 'bn_track_loc', 
            default: null 
        });

        var old_track_location = null;

        function trackChanged() {
            var changed = (old_track_location != track_location.get());
            if (changed) {
                old_track_location = track_location.get();
            }
            return changed;
        }

        function checkUpdateScore() {
            if (trackChanged()) {
                var container = document.getElementById('tree-container');
                if (DATA_TRACKS) {
                    renderTrackTree(DATA_TRACKS, "", container);
                }
            }
        }

        function closeTreeView() {}

        function getJSON(url, callback) {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.onreadystatechange = function() { 
                if (xhr.readyState === 4 && xhr.status === 200) { 
                    callback(JSON.parse(xhr.responseText)); 
                } 
            };
            xhr.send();
        }

        function fetchData() {
            getJSON('/server_data/db_tracks.json', function(d1) {
                DATA_TRACKS = d1;
                startApp();
            });
        }

        function startApp() {
            var container = document.getElementById('tree-container');
            if (DATA_TRACKS) {
                renderTrackTree(DATA_TRACKS, "", container);
            }
            if (typeof startPooling === "function") {
                startPooling();
            }
        }

        // --- Commandes compatibles Android 4 (XMLHttpRequest au lieu de fetch) ---
        const locatorMap = ['', 'a', 'b', 'c', 'd'];

        function sendAudioCommand(command) {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/audio_command', true);
            xhr.setRequestHeader('Content-Type', 'text/plain');
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status !== 200) {
                    console.error("Erreur commande:", xhr.status);
                }
            };
            xhr.send(command);
        }

        function sendTransport(action) {
            sendAudioCommand(action); // 'play' ou 'stop'
        }

        function sendMenu() {
            sendAudioCommand('menu');
        }

        function sendLocator(num) {
            var letter = locatorMap[num];
            if (letter) {
                sendAudioCommand('goto_' + letter);
            }
        }

        function sendSetLocator(num) {
            var letter = locatorMap[num];
            if (letter) {
                sendAudioCommand('set_' + letter);
            }
        }

        window.onload = function() {
            fetchData();
        };
    </script>
</body>
</html>
