<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bn'S Remote</title>
    <!-- Fichiers CSS -->
    <link rel="stylesheet" href="/static/css/tree.css">
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #FFFFFF;
            font-family: sans-serif;
            overflow: hidden;
            height: 100%;
        }

        /* --- Barre de transport compacte ajustée --- */
        #transport-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 124px;
            background-color: #1e1e1e;
            border-bottom: 2px solid #333;
            padding: 5px 6px;
            z-index: 10;
            font-size: 0; /* Annule les espaces blancs entre les inline-block */
        }

        .transport-row {
            width: 100%;
            height: 54px;
            margin-bottom: 6px;
            white-space: nowrap;
        }

        .transport-row:last-child {
            margin-bottom: 0;
        }

        .transport-btn {
            background-color: #2a2a2a;
            color: #FFF;
            border: 1px solid #444;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            text-align: center;
            display: inline-block;
            vertical-align: middle;
            height: 54px;
            width: 23.5%;
            margin-right: 2%;
            font-size: 16px;
        }

        .transport-btn:nth-child(4) {
            margin-right: 0;
        }

        .transport-btn:active {
            background-color: #555;
        }

        /* Ligne 1 : Stop, Play, Mode (Jump/Set), Menu */
        .transport-btn.stop {
            background-color: #c0392b;
            border-color: #e74c3c;
        }
        .transport-btn.stop:active {
            background-color: #e74c3c;
        }

        .transport-btn.play {
            background-color: #2c3e50;
            border-color: #34495e;
        }
        .transport-btn.play:active {
            background-color: #1a252f;
        }

        .transport-btn.mode-toggle {
            background-color: #7f8c8d;
            border-color: #95a5a6;
        }
        /* La bascule reste grise, mais on peut juste l'assombrir ou garder la même couleur de base neutre */
        .transport-btn.mode-toggle.active-set {
            background-color: #596566; /* Un gris légèrement différent pour montrer qu'il est engagé sans crier au feu */
            border-color: #7f8c8d;
        }

        .transport-btn.menu {
            background-color: #4f4f4f;
            border-color: #666;
        }

        /* Ligne 2 : Les 4 locators (1, 2, 3, 4) */
        .transport-btn.locator {
            background-color: #2980b9;
            border-color: #3498db;
            font-size: 18px;
        }

        /* Seuls les locators passent en rouge vif quand le mode SET est actif */
        .transport-btn.locator.active-set {
            background-color: #c0392b;
            border-color: #e74c3c;
        }

        /* --- Icônes en pur CSS (Compatibles Android 4) --- */

        .stop-icon {
            display: inline-block;
            width: 18px;
            height: 18px;
            background: #FFF;
            vertical-align: middle;
        }

        .play-pause-icon {
            display: inline-block;
            vertical-align: middle;
            height: 18px;
            white-space: nowrap;
        }

        .bar-vertical {
            display: inline-block;
            width: 3px;
            height: 18px;
            background: #FFF;
            position: relative;
            vertical-align: middle;
            box-shadow: 6px 0 0 #FFF;
        }

        .triangle-right {
            display: inline-block;
            width: 0;
            height: 0;
            border-top: 9px solid transparent;
            border-bottom: 9px solid transparent;
            border-left: 14px solid #FFF;
            vertical-align: middle;
            margin-left: 5px;
        }

        .hamburger-icon {
            display: inline-block;
            width: 22px;
            height: 4px;
            background: #FFF;
            position: relative;
            vertical-align: middle;
            box-shadow: 0 -7px 0 #FFF, 0 7px 0 #FFF;
        }

        /* --- Conteneur de l'arbre --- */
        #tree-container {
            position: absolute !important;
            top: 124px !important;
            bottom: 0 !important;
            left: 0 !important;
            right: 0 !important;
            width: 100% !important;
            overflow-y: scroll !important;
            -webkit-overflow-scrolling: touch;
            background-color: #121212;
            flex-grow: unset !important;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- Barre de transport compacte -->
    <div id="transport-bar">
        <!-- Ligne 1 : Stop, Play, Toggle Mode, Menu -->
        <div class="transport-row">
            <button class="transport-btn stop" onclick="sendTransport('stop')"><span class="stop-icon"></span></button>
            <button class="transport-btn play" onclick="sendTransport('play')">
                <span class="play-pause-icon">
                    <span class="bar-vertical"></span>
                    <span class="triangle-right"></span>
                </span>
            </button>
            <button id="btn-mode" class="transport-btn mode-toggle" onclick="toggleLocatorMode()">Jump</button>
            <button class="transport-btn menu" onclick="sendMenu()"><span class="hamburger-icon"></span></button>
        </div>
        <!-- Ligne 2 : Les 4 Locators uniformes -->
        <div class="transport-row">
            <button class="transport-btn locator" onclick="handleLocator(1)">1</button>
            <button class="transport-btn locator" onclick="handleLocator(2)">2</button>
            <button class="transport-btn locator" onclick="handleLocator(3)">3</button>
            <button class="transport-btn locator" onclick="handleLocator(4)">4</button>
        </div>
    </div>

    <!-- Éléments requis pour tree.js -->
    <div id="tree-popup-overlay"></div>
    <div id="tree-popup-content"></div>

    <!-- Conteneur de l'arbre principal -->
    <div id="tree-container"></div>

    <!-- Scripts de ton projet -->
    <script src="/static/js/objects.js"></script>
    <script src="/static/js/network.js"></script>
    <script src="/static/js/tree.js"></script>
    <script>
        var DATA_TRACKS = null;
        var DATA_UI_POPULAR = null;
        var DATA_UI_CLASSIQUE = null;
        var META_INSTRUMENTS = null;

        var track_location = createProp({ 
            key: 'bn_track_loc', 
            default: null 
        });

        var old_track_location = null;

        // État de la bascule (false = Jump, true = Set)
        var isSetMode = false;

        function setLocatorMode(active) {
            isSetMode = active;
            var modeBtn = document.getElementById('btn-mode');
            var locatorBtns = document.getElementsByClassName('locator');

            if (isSetMode) {
                modeBtn.innerText = "Set";
                modeBtn.classList.add('active-set');
                // Seuls les locators passent en rouge
                for (var i = 0; i < locatorBtns.length; i++) {
                    locatorBtns[i].classList.add('active-set');
                }
            } else {
                modeBtn.innerText = "Jump";
                modeBtn.classList.remove('active-set');
                // Remet les locators en bleu normal
                for (var i = 0; i < locatorBtns.length; i++) {
                    locatorBtns[i].classList.remove('active-set');
                }
            }
        }

        function toggleLocatorMode() {
            setLocatorMode(!isSetMode);
        }

        function trackChanged() {
            var changed = (old_track_location != track_location.get());
            if (changed) {
                old_track_location = track_location.get();
            }
            return changed;
        }

        function checkUpdateScore() {
            if (trackChanged()) {
                var container = document.getElementById('tree-container');
                if (DATA_TRACKS) {
                    renderTrackTree(DATA_TRACKS, "", container);
                }
            }
        }

        function closeTreeView() {}

        function getJSON(url, callback) {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.onreadystatechange = function() { 
                if (xhr.readyState === 4 && xhr.status === 200) { 
                    callback(JSON.parse(xhr.responseText)); 
                } 
            };
            xhr.send();
        }

        function fetchData() {
            getJSON('/server_data/db_tracks.json', function(d1) {
                DATA_TRACKS = d1;
                startApp();
            });
        }

        function startApp() {
            var container = document.getElementById('tree-container');
            if (DATA_TRACKS) {
                renderTrackTree(DATA_TRACKS, "", container);
            }
            if (typeof startPooling === "function") {
                startPooling();
            }
        }

        // --- Commandes compatibles Android 4 (XMLHttpRequest au lieu de fetch) ---
        const locatorMap = ['', 'a', 'b', 'c', 'd'];

        function sendAudioCommand(command) {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/audio_command', true);
            xhr.setRequestHeader('Content-Type', 'text/plain');
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status !== 200) {
                    console.error("Erreur commande:", xhr.status);
                }
            };
            xhr.send(command);
        }

        function sendTransport(action) {
            sendAudioCommand(action); // 'play' ou 'stop'
        }

        function sendMenu() {
            sendAudioCommand('menu');
        }

        function handleLocator(num) {
            var letter = locatorMap[num];
            if (letter) {
                if (isSetMode) {
                    sendAudioCommand('set_' + letter);
                    // Repasse automatiquement en mode Jump après un set
                    setLocatorMode(false);
                } else {
                    sendAudioCommand('goto_' + letter);
                }
            }
        }

        window.onload = function() {
            fetchData();
        };
    </script>
</body>
</html>
