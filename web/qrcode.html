<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bn'S QR Codes</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: url('/static/img/splash.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            -webkit-background-size: contain;
            background-size: contain; 
        }

        .menu {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            width: 90%;
            max-width: 380px;
            margin: 0 auto;
            transform: translateY(-50%);
            text-align: center;
            z-index: 100;
        }

        .qr-row {
            text-align: center;
        }

        /* Cartes toujours empilées verticalement pour rester dans le splash screen */
        .qr-card {
            display: block;
            width: 100%;
            max-width: 340px;
            padding: 8px 10px;
            margin: 0 auto 12px auto;
            box-sizing: border-box;
            text-align: center;
        }

        .qr-card:last-child {
            margin-bottom: 0;
        }

        .qr-card h3 {
            font-family: sans-serif;
            font-size: 15px;
            font-weight: bold;
            margin: 0 0 4px 0;
            text-shadow: 1px 1px 3px #000;
        }

        .wifi-card h3 { color: #38bdf8; }
        .lan-card h3 { color: #4ade80; }

        /* URL en 16px sur une seule ligne */
        .qr-card .url-text {
            font-family: monospace;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.8);
            padding: 6px 10px;
            border-radius: 4px;
            margin: 0 0 6px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Le fond blanc obligatoire pour le scan du QR code */
        .qr-wrapper {
            background: #ffffff;
            padding: 6px;
            border-radius: 6px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* QR code optimisé */
        .qr-card img {
            width: 180px;
            height: 180px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="menu">
            <div class="qr-row">
                
                {% for net in networks %}
                <div class="qr-card {{ net.type }}-card">
                    <h3>{{ net.title }}</h3>
                    <p class="url-text">{{ net.url }}</p>
                    <div class="qr-wrapper">
                        <img src="/static/{{ net.filename }}" alt="{{ net.title }}">
                    </div>
                </div>
                {% endfor %}

            </div>
        </div>
    </div>

</body>
</html>
