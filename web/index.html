<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Back'n Score</title>
    <style>
        /* On force le html et le body à prendre toute la place sans marges */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }

        /* Le conteneur occupe 100% du parent (donc de l'écran) */
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            /* Version compatible Android 4 pour le fond */
            background-image: url('/static/img/splash.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            -webkit-background-size: contain; /* 'contain' pour voir TOUTE l'image sans rognage */
            background-size: contain; 
        }

        /* Le menu centré parfaitement de manière universelle sur tablettes et téléphones */
        .menu {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            width: 85%;
            max-width: 420px;
            margin: 0 auto;     /* Centre automatiquement horizontalement */
            margin-top: -160px; /* Ajustement pour le centrage vertical */
            text-align: center;
            z-index: 100;
        }

        .btn {
            display: block;
            padding: 18px 20px;
            margin-bottom: 15px;
            text-decoration: none;
            color: #ffffff;
            background: #222222; /* Pas de transparence RGBA pour Android 4 */
            border: 2px solid #555555;
            border-radius: 10px;
            font-family: sans-serif;
            font-size: 28px; /* Grande taille bien lisible sur tablette 10 pouces et téléphone */
            font-weight: bold;
            box-shadow: 2px 2px 10px #000;
        }

        .btn-chef {
            border-color: #ffca28;
            color: #ffca28;
        }

        /* --- CORRECTIF POUR LE PC EN MODE PAYSAGE --- */
        @media screen and (orientation: landscape) {
            .menu {
                width: 350px;
                margin-left: auto;
                margin-right: auto;
                margin-top: -110px;
            }
            .btn {
                font-size: 18px; /* Taille raisonnable pour un moniteur PC */
                padding: 12px 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="menu">
            <a href="/qrcode" class="btn">QR Codes</a>
            <a href="/pupitre" class="btn">Pupitre</a>
            <a href="/selector" class="btn">Track Selector</a>
            <a href="/admin" class="btn">Administration</a>
        </div>
    </div>

</body>
</html>
